name: POスクリーナー更新
on:
  schedule:
    - cron: '0 23 * * 1-5'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy pandas
      - name: Stooq日足ZIP取得
        run: curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://stooq.com/db/h/d_jp_txt.zip' -o /tmp/d_jp_txt.zip
      - run: python mobile_screener/update_data.py /tmp/d_jp_txt.zip mobile_screener/data.json
      - name: 結果を保存
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mobile_screener/data.json
          git diff --cached --quiet || git commit -m "Update PO screen $(date -u +%F)"
          git push
